name: Deploy Backend .NET

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, prod]

    steps:
      # 📦 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 Login Docker Hub
      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 🐳 Build da imagem
      - name: Build image
        run: docker build -t mantecsystems/mantec2-back:latest .

      # 📤 Push da imagem
      - name: Push image
        run: docker push mantecsystems/mantec2-back:latest

      # 🚀 Deploy local (sem SSH)
      - name: Deploy no Swarm (teste)
        run: |
          docker pull mantecsystems/mantec2-back:latest

          # remove serviço anterior (se existir)
          docker service rm automacao_mantec2 || true

          # sobe nova versão
          docker service create \
            --replicas 2 \
            --name automacao_mantec2 \
            --network backend \
            -p 5010:5010 \
            -e ASPNETCORE_URLS=http://+:5010 \
            mantecsystems/mantec2-back:latest